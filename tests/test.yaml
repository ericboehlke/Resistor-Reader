# Mirrors production pipeline keys used by tests.

processing:
  debug_image: true

region_of_interest:
  debug_image: true

segmentation:
  # Column profile is built from a central horizontal strip so the shaded,
  # curved top and bottom of the body do not wash the band colours out.
  strip_top: 0.28
  strip_bottom: 0.74
  matte_keep_ratio: 0.70
  band_smooth_window: 7
  # Metallic bands are found by their specular sparkle.  The chroma gate tells
  # that sparkle apart from plain glare on the body, which washes out to near
  # white; the cap stops a gold band from towering over the others and dragging
  # the detection threshold up with it.
  texture_weight: 1.0
  texture_cap: 25.0
  highlight_ratio: 0.15
  chroma_gate_low: 70.0
  chroma_gate_high: 110.0
  # Band extraction: sweep for a threshold giving exactly four runs, then fill
  # any bands the sweep missed by claiming the strongest leftover peaks.
  thr_frac_min: 0.20
  thr_frac_max: 0.75
  thr_frac_step: 0.025
  min_signal: 5.0
  min_band_width_px: 5
  min_band_separation_px: 9
  max_band_width_ratio: 0.35
  peak_extent_frac: 0.45
  peak_rise_tol: 0.15
  edge_margin: 4
  end_pin_ratio: 0.04
  upsample: 4
  create_plot: false
  debug_image: true

classification:
  strip_top: 0.25
  strip_bottom: 0.75
  matte_keep_ratio: 0.70
  # Gold and silver are scored by specular spread rather than mean colour: the
  # matte median that identifies every other colour throws their sheen away.
  metallic_gain: 26.0
  metallic_offset: 34.0
  metallic_scale: 22.0
  metallic_min_value: 70.0
  metallic_max_hue: 28.0
  silver_max_sat: 70.0
  highlight_ratio: 0.15
  chroma_gate_low: 70.0
  chroma_gate_high: 110.0
  debug_image: true

decode:
  # Search the top-k colours per band across both band orders, keeping only
  # sequences that form a legal resistor code.
  top_k: 3
  gold_tolerance_bonus: 10.0
  e24_bonus: 8.0
  min_resistance: 0.1
  max_resistance: 1.0e8

runtime:
  debug:
    enabled: true
    dir: "logs/"
